<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1f4d"/>
      <stop offset="100%" stop-color="#0e2a63"/>
    </linearGradient>
    <linearGradient id="flameB2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#sky2)"/>

  <g fill="#ffffff">
    <circle cx="80" cy="30" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="60" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="25" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="50" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="65" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting asteroid belt -->
  <g fill="#1e3a8a" opacity="0.85">
    <ellipse cx="150" cy="150" rx="18" ry="12" transform="rotate(15 150 150)"/>
    <ellipse cx="330" cy="180" rx="12" ry="9" transform="rotate(-10 330 180)"/>
    <ellipse cx="600" cy="160" rx="22" ry="15" transform="rotate(8 600 160)"/>
    <ellipse cx="860" cy="185" rx="14" ry="10" transform="rotate(-18 860 185)"/>
    <ellipse cx="1050" cy="150" rx="20" ry="13" transform="rotate(12 1050 150)"/>
  </g>
  <g fill="#38bdf8" opacity="0.5">
    <ellipse cx="150" cy="150" rx="18" ry="12" transform="rotate(15 150 150)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="160" rx="22" ry="15" transform="rotate(8 600 160)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1050" cy="150" rx="20" ry="13" transform="rotate(12 1050 150)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <text x="600" y="45" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" fill="#7dd3fc" opacity="0.8" letter-spacing="2">
    ⚡ TECH STACK AHEAD — NAVIGATING THE ASTEROID BELT
  </text>

  <!-- ship continuing its dive, now mid-image -->
  <g>
    <g>
      <path d="M0,0 l-22,5 l22,8 l4,-6.5 z" fill="url(#flameB2)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.4s" repeatCount="indefinite"/>
      </path>
      <g transform="rotate(20)">
        <rect x="0" y="-5.5" width="28" height="11" rx="5.5" fill="#e0f2fe"/>
        <polygon points="28,-5.5 38,0 28,5.5" fill="#38bdf8"/>
        <polygon points="3,-5.5 -2,-12 8,-5.5" fill="#2563eb"/>
        <polygon points="3,5.5 -2,12 8,5.5" fill="#2563eb"/>
      </g>
    </g>
    <animateMotion path="M60,70 C 300,140 700,110 1140,150" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- companion bird, simple wing-flap silhouette -->
  <g fill="#bae6fd">
    <g id="bird">
      <path d="M0,0 Q-14,-10 -26,-2 Q-13,-3 0,0 Q13,-3 26,-2 Q14,-10 0,0 Z">
        <animate attributeName="d"
          values="M0,0 Q-14,-10 -26,-2 Q-13,-3 0,0 Q13,-3 26,-2 Q14,-10 0,0 Z;
                   M0,0 Q-14,-3 -26,2 Q-13,-1 0,0 Q13,-1 26,2 Q14,-3 0,0 Z;
                   M0,0 Q-14,-10 -26,-2 Q-13,-3 0,0 Q13,-3 26,-2 Q14,-10 0,0 Z"
          dur="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <animateMotion path="M180,60 C 420,120 760,90 1080,130" dur="7.6s" repeatCount="indefinite"/>
  </g>
</svg>
