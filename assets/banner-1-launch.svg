<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#071233"/>
      <stop offset="100%" stop-color="#0b1f4d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0c2f5c"/>
    </radialGradient>
    <linearGradient id="titleGradB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="flameB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky1)"/>
  <ellipse cx="900" cy="120" rx="300" ry="150" fill="url(#glow1)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="45" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="120" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="220" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="250" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ringed planet -->
  <g transform="translate(970,110)">
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.5" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="42" fill="url(#planetB)">
      <animate attributeName="r" values="42;45;42" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.35" transform="rotate(-16)" stroke-dasharray="4 6"/>
  </g>

  <!-- title -->
  <text x="560" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="52" font-weight="700" fill="url(#titleGradB)" letter-spacing="3">
    JANITH MARASINGHE
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <line x1="410" y1="162" x2="710" y2="162" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <circle cx="560" cy="162" r="3" fill="#7dd3fc">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="560" y="270" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="15" fill="#7dd3fc" opacity="0.75" letter-spacing="2">
    MISSION START — SCROLL TO FOLLOW THE FLIGHT ↓
  </text>

  <!-- ship beginning its descent, bottom-left, nose angled downward -->
  <g>
    <g id="ship1">
      <path d="M0,0 l-24,6 l24,9 l5,-7.5 z" fill="url(#flameB)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.45s" repeatCount="indefinite"/>
      </path>
      <g transform="rotate(35)">
        <rect x="0" y="-6" width="32" height="12" rx="6" fill="#e0f2fe"/>
        <polygon points="32,-6 43,0 32,6" fill="#38bdf8"/>
        <polygon points="4,-6 -2,-13 9,-6" fill="#2563eb"/>
        <polygon points="4,6 -2,13 9,6" fill="#2563eb"/>
        <circle cx="19" cy="0" r="3" fill="#2563eb"/>
      </g>
    </g>
    <animateMotion path="M140,80 C 260,160 320,220 260,300" dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
