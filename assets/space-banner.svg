<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0014"/>
      <stop offset="45%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d0f3f"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="rocketFlame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <ellipse cx="250" cy="90" rx="260" ry="130" fill="url(#nebula1)"/>
  <ellipse cx="950" cy="220" rx="280" ry="140" fill="url(#nebula2)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="70" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="150" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="45" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="65" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="70" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="120" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="130" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="150" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ringed planet, gently pulsing glow -->
  <g transform="translate(1005,120)">
    <ellipse cx="0" cy="0" rx="98" ry="22" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5" transform="rotate(-16)"/>
    <circle cx="0" cy="0" r="44" fill="url(#planetGlow)">
      <animate attributeName="r" values="44;47;44" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="0" cy="0" rx="98" ry="22" fill="none" stroke="#fde68a" stroke-width="1.5" opacity="0.35" transform="rotate(-16)" stroke-dasharray="4 6"/>
  </g>

  <!-- flying rocket with animated flame + motion path -->
  <g>
    <g id="rocketGroup">
      <path d="M0,0 l-26,7 l26,10 l6,-8.5 z" fill="url(#rocketFlame)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <g transform="rotate(-25)">
        <rect x="0" y="-6" width="34" height="12" rx="6" fill="#f4f4f5"/>
        <polygon points="34,-6 46,0 34,6" fill="#f472b6"/>
        <polygon points="4,-6 -2,-14 10,-6" fill="#a855f7"/>
        <polygon points="4,6 -2,14 10,6" fill="#a855f7"/>
        <circle cx="20" cy="0" r="3.2" fill="#a855f7"/>
      </g>
    </g>
    <animateMotion path="M120,250 C 300,150 520,190 760,90 S 1050,40 1150,20" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="530" y="150" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="54" font-weight="700" fill="url(#titleGrad)" letter-spacing="3">
    JANITH MARASINGHE
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <line x1="380" y1="172" x2="680" y2="172" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  <circle cx="530" cy="172" r="3" fill="#fbbf24">
    <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
