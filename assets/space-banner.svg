<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="55%" stop-color="#050b1a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0e7fb8"/>
      <stop offset="100%" stop-color="#053a56"/>
    </radialGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="100%" stop-color="#0c1526"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a30"/>
      <stop offset="100%" stop-color="#080f1e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4" opacity="0.8"/>
    <circle cx="140" cy="90" r="1" opacity="0.6"/>
    <circle cx="220" cy="30" r="1.6" opacity="0.9"/>
    <circle cx="310" cy="70" r="1" opacity="0.5"/>
    <circle cx="400" cy="20" r="1.2" opacity="0.7"/>
    <circle cx="470" cy="60" r="1" opacity="0.6"/>
    <circle cx="90" cy="140" r="1" opacity="0.5"/>
    <circle cx="180" cy="160" r="1.3" opacity="0.7"/>
    <circle cx="30" cy="200" r="1" opacity="0.5"/>
    <circle cx="640" cy="45" r="1.4" opacity="0.8"/>
    <circle cx="700" cy="90" r="1" opacity="0.6"/>
    <circle cx="760" cy="25" r="1.6" opacity="0.9"/>
    <circle cx="830" cy="65" r="1" opacity="0.5"/>
    <circle cx="900" cy="35" r="1.2" opacity="0.7"/>
    <circle cx="960" cy="80" r="1" opacity="0.6"/>
    <circle cx="1030" cy="30" r="1.3" opacity="0.7"/>
    <circle cx="1100" cy="60" r="1" opacity="0.5"/>
    <circle cx="1150" cy="100" r="1.2" opacity="0.6"/>
    <circle cx="560" cy="120" r="1" opacity="0.5"/>
    <circle cx="500" cy="150" r="1.2" opacity="0.6"/>
  </g>

  <!-- shooting star -->
  <line x1="150" y1="55" x2="210" y2="15" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>

  <!-- planet with ring -->
  <g transform="translate(1005,110)">
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" transform="rotate(-18)"/>
    <circle cx="0" cy="0" r="42" fill="url(#planetGlow)"/>
    <ellipse cx="0" cy="0" rx="95" ry="20" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.35" transform="rotate(-18)" stroke-dasharray="4 6"/>
    <circle cx="18" cy="-70" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- mountains back layer -->
  <polygon points="0,260 120,190 230,240 340,175 460,235 600,170 760,245 900,190 1040,250 1200,200 1200,320 0,320"
           fill="url(#mountain2)"/>

  <!-- mountains front layer -->
  <polygon points="0,300 90,235 180,275 300,215 420,270 540,220 660,280 800,225 940,270 1080,230 1200,270 1200,320 0,320"
           fill="url(#mountain1)"/>

  <!-- pine trees silhouettes -->
  <g fill="#0a1220">
    <polygon points="120,300 128,275 136,300"/>
    <polygon points="150,305 158,280 166,305"/>
    <polygon points="980,300 988,278 996,300"/>
    <polygon points="1015,306 1023,282 1031,306"/>
  </g>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="56" font-weight="700" fill="url(#titleGrad)" letter-spacing="4">JANITH MARASINGHE</text>
  <line x1="470" y1="172" x2="730" y2="172" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
  <circle cx="600" cy="172" r="3" fill="#22d3ee"/>
</svg>
