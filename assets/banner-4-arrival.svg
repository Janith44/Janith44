<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f52"/>
      <stop offset="100%" stop-color="#040c26"/>
    </linearGradient>
    <linearGradient id="flameB4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#sky4)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="25" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="45" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="55" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="40" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" fill="#7dd3fc" opacity="0.85" letter-spacing="2">
    🛰️ APPROACHING BASE — STATS INCOMING
  </text>

  <!-- space station -->
  <g transform="translate(980,120)" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.9">
    <circle r="30" fill="#0c2f5c"/>
    <circle r="46" stroke-dasharray="6 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <rect x="-10" y="-10" width="20" height="20" fill="#7dd3fc" stroke="none">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <line x1="-46" y1="0" x2="-30" y2="0"/>
    <line x1="46" y1="0" x2="30" y2="0"/>
  </g>

  <!-- ship on final approach, landing gear extended -->
  <g>
    <g>
      <path d="M0,0 l-18,4 l18,7 l3,-5.5 z" fill="url(#flameB4)">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <g transform="rotate(-6)">
        <rect x="0" y="-5.5" width="28" height="11" rx="5.5" fill="#e0f2fe"/>
        <polygon points="28,-5.5 38,0 28,5.5" fill="#38bdf8"/>
        <polygon points="3,-5.5 -2,-12 8,-5.5" fill="#2563eb"/>
        <polygon points="3,5.5 -2,12 8,5.5" fill="#2563eb"/>
        <line x1="6" y1="6" x2="2" y2="14" stroke="#93c5fd" stroke-width="1.5"/>
        <line x1="18" y1="6" x2="22" y2="14" stroke="#93c5fd" stroke-width="1.5"/>
      </g>
    </g>
    <animateMotion path="M80,140 C 340,100 650,150 900,120" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- bird resting near the station -->
  <g fill="#bae6fd" transform="translate(1060,150)">
    <path d="M0,0 Q-12,-8 -22,-1 Q-11,-2 0,0 Q11,-2 22,-1 Q12,-8 0,0 Z">
      <animate attributeName="d"
        values="M0,0 Q-12,-8 -22,-1 Q-11,-2 0,0 Q11,-2 22,-1 Q12,-8 0,0 Z;
                 M0,0 Q-12,-2 -22,2 Q-11,0 0,0 Q11,0 22,2 Q12,-2 0,0 Z;
                 M0,0 Q-12,-8 -22,-1 Q-11,-2 0,0 Q11,-2 22,-1 Q12,-8 0,0 Z"
        dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
